      - generic [ref=e420]:
        - paragraph [ref=e421]:
          - strong [ref=e422]: To those who shape the world,
        - paragraph [ref=e423]: Design was never meant to happen through buttons, commands, and rigid workflows.
        - paragraph [ref=e424]: It begins more naturally than that, through sketches, markups, references, conversation, and iteration. Through the back-and-forth between instinct and judgment that gives architecture its life.
        - paragraph [ref=e425]: But for too long, that flow has been interrupted, asking you to translate, redraw, rebuild, and re-explain instead of simply design.
        - paragraph [ref=e426]: "We built Tracing Paper for the way this work actually happens: a place where intent can be expressed more directly, and where the production burden fades into the background."
        - paragraph [ref=e427]: So you can explore more freely, refine more quickly, and stay closer to the ideas that matter most.
        - paragraph [ref=e428]:
          - strong [ref=e429]: This is for you.
